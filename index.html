<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Riot Games - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
    <body>
        <main class="opacity">
            <div class="free-space">
                <span></span>
            </div>
            <div class="login-container">
                <div class="logo-container">
                    <img src="assets/riot-logo.png" alt="RIOT GAMES" class="logo">
                    <span class="text-signin">SIGN IN</span>
                </div>
                <div class="input-fields">
                    <div class="login">
                        <input type="email" name="email" id="email" placeholder="Email" required size="30" class="input">
                        <img src="assets/user-icon.png" alt="user icon" class="icon">
                    </div>
                    <div class="login">
                        <input type="password" name="password" id="password" placeholder="Password" required size="30" class="input">
                        <img src="assets/eyecon.png" alt="eye icon" class="icon">
                    </div>
                        <div class="input-bottom">
                            <div class="checkbox">
                                <input type="checkbox" name="remember_user" id="remember" class="remember-user">
                                <label for="remember">Remember Me</label>
                            </div>
                            <p>Forget Password?</p>
                        </div>
                </div>
                <div class="buttons">
                    <button class="btn btn-signin">SIGN IN</button><br>
                    <span class="no-account">Dont't have an account?<a href="https://authenticate.riotgames.com/?client_id=accountodactyl-prod&method=riot_identity_signup&platform=web&redirect_uri=https%3A%2F%2Fauth.riotgames.com%2Fauthorize%3Facr_values%3Durn%253Ariot%253Agold%26client_id%3Daccountodactyl-prod%26prompt%3Dsignup%26redirect_uri%3Dhttps%253A%252F%252Faccount.riotgames.com%252Foauth2%252Flog-in%26response_type%3Dcode%26scope%3Dopenid%2520email%2520profile%2520riot%253A%252F%252Friot.atlas%252Fopenid%2520riot%253A%252F%252Friot.atlas%252Faccounts.edit%2520riot%253A%252F%252Friot.atlas%252Faccounts%252Fpassword.edit%2520riot%253A%252F%252Friot.atlas%252Faccounts%252Femail.edit%2520riot%253A%252F%252Friot.atlas%252Faccounts.auth%2520riot%253A%252F%252Fthird_party.revoke%2520riot%253A%252F%252Fthird_party.query%2520riot%253A%252F%252Fforgetme%252Fnotify.write%2520riot%253A%252F%252Friot.authenticator%252Fauth.code%2520riot%253A%252F%252Friot.authenticator%252Fauthz.edit%2520riot%253A%252F%252Frso%252Fmfa%252Fdevice.write%2520riot%253A%252F%252Friot.authenticator%252Fidentity.add%2520riot%253A%252F%252Friot.atlas%252Faccounts.read%2520riot%253A%252F%252Friot.parent-portal%252Fparent.write%26state%3D3eb52282-9c0c-42cc-90d8-e30583a79c47%26ui_locales%3Den-US&security_profile=high">
                        Sign Up
                    </a></span>
                    <span class="signin-options-text">Or Sign In With</span>
                    <div class="signin-options">
                        <button class="btn google-signin"><img src="assets/integrations-logo-google.png" alt="sign in with google" class="signin-logo"></button>
                        <button class="btn xbox-signin"><img src="assets/consoles-xbox-xxl.png" alt="sign in with xbox" class="signin-logo"></button>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
